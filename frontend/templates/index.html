<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Signup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #fff;
      padding: 25px;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .toggle {
      text-align: center;
      margin-top: 10px;
      cursor: pointer;
      color: #007bff;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
    <form action ='/login' method = 'POST'>
        <!-- Login Form -->
        <div id="loginForm">
            
                <h2>Login</h2>
                <input type="email" name = "email" placeholder="Email" required>
                <input type="password" name = "password" placeholder="Password" required>
                <button type = "submit">Login</button>
                <div class="toggle" onclick="toggleForm()">Don't have an account? Sign Up</div>
        </div>
    </form>
  

  <!-- Signup Form -->
  <div id="signupForm" class="hidden">
    <h2>Sign Up</h2>
    <input type="text" name = "full_name" placeholder="Full Name" required>
    <input type="email" name = "email" placeholder="Email" required>
    <input type="password" name = "password" placeholder="Password" required>
    <button type = "submit">Sign Up</button>
    <div class="toggle" onclick="toggleForm()">Already have an account? Login</div>
  </div>

</div>

<script>
  function toggleForm() {
    document.getElementById("loginForm").classList.toggle("hidden");
    document.getElementById("signupForm").classList.toggle("hidden");
  }

  function login() {
    alert("Login clicked (connect backend here)");
  }

  function signup() {
    alert("Signup clicked (connect backend here)");
  }
</script>

</body>
</html>
